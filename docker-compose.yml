services:
  logboost-web:
    build: .
    env_file: .env
    environment:
      # Binary in /app, data files in volumes (symlinked to /app for LogBoost)
      LOGBOOST_PATH: /app/logboost
      MAXMIND_DIR: /data/maxmind
      THREAT_DB_DIR: /data/intel
      LOGBOOST_DB_PATH: /data/db/logboost_admin.db
      # SSL configuration
      SSL_PORT: ${SSL_PORT:-8443}
      SSL_COMMON_NAME: ${SSL_COMMON_NAME:-localhost}
    ports:
      - "${LOGBOOST_PORT:-5000}:5000"
      - "${SSL_PORT:-8443}:${SSL_PORT:-8443}"
    volumes:
      # Named volumes — Docker-managed, no host setup required, works on Windows
      # Data persists across container rebuilds
      - logboost-maxmind:/data/maxmind      # MaxMind GeoIP databases
      - logboost-intel:/data/intel          # Threat intelligence (threats.db)
      - logboost-cache:/data/cache          # Cache files (dns, idb, whois)
      - logboost-config:/data/config        # Config (feed_config.json, mm_api.txt)
      - logboost-db:/data/db                # Admin SQLite database
      - logboost-uploads:/app/uploads       # Session uploads
      - logboost-output:/app/output         # Session output
      - logboost-ssl:/data/ssl              # SSL certificates (auto-generated or mounted)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# Named volumes — Docker manages these automatically
volumes:
  logboost-maxmind:
  logboost-intel:
  logboost-cache:
  logboost-config:
  logboost-db:
  logboost-uploads:
  logboost-output:
  logboost-ssl:
