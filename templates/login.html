<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · LogBoost</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="auth on">
  <div class="auth-right">
    <div class="stack" style="width:400px;max-width:100%;gap:26px">
      <div class="logo" style="padding:0;font-size:18px"><span class="bars"><i></i><i></i><i></i></span>LogBoost</div>
      <div>
        <h1>Sign in</h1>
        <div class="mono muted" style="margin-top:6px" data-host></div>
      </div>
      {% set messages = get_flashed_messages(with_categories=true) %}
      {% set failed = messages | selectattr(0, 'equalto', 'error') | list | length > 0 %}
      {% for category, message in messages %}
      <div class="notice {{ 'red' if category == 'error' else 'green' if category == 'success' else 'plain' }}" role="alert">{{ message }}</div>
      {% endfor %}
      <form class="stack" method="post" action="{{ url_for('auth_routes.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Username</label>
          <input class="input lg" type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="row">
            <input class="input lg{{ ' bad' if failed }}" type="password" id="password" name="password" required autocomplete="current-password" data-caps-hint="caps-hint">
            <button type="button" class="btn" style="height:44px" data-show-password="password" aria-pressed="false">Show</button>
          </div>
          <small class="amber hide" id="caps-hint">Caps Lock is on</small>
        </div>
        <button type="submit" class="btn primary lg">Sign in</button>
      </form>
      <div class="mono faint" style="font-size:12px">LogBoost Web · <a class="muted" href="https://github.com/joeavanzato/logboost-web" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
