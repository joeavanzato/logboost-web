{# Error fragment, swapped into #results-container (or #stats-container). #}
<div class="notice red results-error" role="alert">
  <b>Processing error</b>
  <div class="error-message">{{ error }}</div>
  {% if command %}
  <div class="muted" style="font-size:12px;margin-top:10px">Command executed:</div>
  <pre class="error-command mono">{{ command }}</pre>
  {% endif %}
</div>
